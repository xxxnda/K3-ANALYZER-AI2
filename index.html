<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K3 Safety AI Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen p-8 font-sans">
    <div
      class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden p-6"
    >
      <h1 class="text-3xl font-bold text-gray-800 mb-2 text-center">
        👷 K3 Safety AI Detector
      </h1>
      <p class="text-gray-500 mb-6 text-center">
        Upload foto proyek untuk deteksi APD & Analisis Risiko
      </p>

      <div
        class="mb-6 p-4 border-2 border-dashed border-gray-300 rounded-lg text-center hover:bg-gray-50 transition"
      >
        <input
          type="file"
          id="imageInput"
          accept="image/*"
          class="hidden"
          onchange="previewImage()"
        />
        <label for="imageInput" class="cursor-pointer">
          <div class="text-gray-600 font-medium">Klik untuk Pilih Foto</div>
          <div class="text-xs text-gray-400 mt-1">JPG, PNG supported</div>
        </label>
      </div>

      <div
        id="previewContainer"
        class="hidden mb-6 text-center bg-black rounded-lg p-2"
      >
        <img
          id="previewImg"
          class="max-h-[400px] mx-auto rounded"
          src=""
          alt="Preview"
        />
      </div>

      <button
        onclick="analyzeImage()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md flex justify-center items-center gap-2"
      >
        <span id="btnText">🔍 Analisa Foto Sekarang</span>
      </button>

      <div
        id="errorMessage"
        class="hidden mt-4 p-4 bg-red-100 text-red-700 rounded-lg border border-red-300 text-sm"
      ></div>

      <div
        id="resultArea"
        class="hidden mt-8 border-t-2 border-gray-100 pt-6 animate-fade-in"
      >
        <div class="mb-4">
          <h3 class="font-bold text-gray-700 mb-2">🔍 Terdeteksi (YOLO):</h3>
          <div id="objectTags" class="flex flex-wrap gap-2"></div>
        </div>

        <div
          class="bg-yellow-50 border-l-4 border-yellow-400 p-5 rounded-r shadow-sm"
        >
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-xl text-gray-800">📋 Laporan Safety</h3>
            <span
              id="riskBadge"
              class="px-4 py-1 rounded-full text-sm font-bold text-white bg-gray-500"
              >LOADING...</span
            >
          </div>

          <p
            id="sceneCaption"
            class="text-gray-600 italic mb-4 text-sm border-b pb-2"
          >
            ...
          </p>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <h4 class="font-bold text-red-600 mb-1">⚠️ Risiko Bahaya:</h4>
              <ul
                id="riskList"
                class="list-disc list-inside text-sm text-gray-700 space-y-1"
              ></ul>
            </div>
            <div>
              <h4 class="font-bold text-green-600 mb-1">✅ Rekomendasi:</h4>
              <ul
                id="recommendationList"
                class="list-disc list-inside text-sm text-gray-700 space-y-1"
              ></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function previewImage() {
        const input = document.getElementById("imageInput");
        const previewContainer = document.getElementById("previewContainer");
        const previewImg = document.getElementById("previewImg");

        document.getElementById("resultArea").classList.add("hidden");
        document.getElementById("errorMessage").classList.add("hidden");

        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = function (e) {
            previewImg.src = e.target.result;
            previewContainer.classList.remove("hidden");
          };
          reader.readAsDataURL(input.files[0]);
        }
      }

      async function analyzeImage() {
        const input = document.getElementById("imageInput");
        const file = input.files[0];

        if (!file) {
          alert("⚠️ Pilih foto dulu ya!");
          return;
        }

        const btnText = document.getElementById("btnText");
        btnText.innerText = "⏳ Sedang Memproses (Backend + AI)...";
        document.getElementById("errorMessage").classList.add("hidden");

        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch("http://localhost:8001/analyze-image", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error(
              `Server Error: ${response.status} ${response.statusText}`
            );
          }

          const data = await response.json();
          displayResult(data);
        } catch (error) {
          console.error(error);
          const errorBox = document.getElementById("errorMessage");
          errorBox.classList.remove("hidden");
          errorBox.innerHTML = `<strong>Terjadi Kesalahan!</strong><br>Detail: ${error.message}`;
        } finally {
          btnText.innerText = "🔍 Analisa Foto Sekarang";
        }
      }

      function displayResult(data) {
        const rawObjects = data.detected_raw || [];

        let llm = {};
        const rawLLM = data.analysis.llm_analysis;

        try {
          if (typeof rawLLM === "string") {
            llm = JSON.parse(rawLLM);
          } else if (typeof rawLLM === "object") {
            llm = rawLLM;
          }
        } catch (e) {
          console.error("Gagal parsing JSON LLM:", e);
          llm = {};
        }

        const ruleBased = data.analysis.rule_based_risks || [];
        const ruleLevel = data.analysis.rule_based_risk_level || "UNKNOWN";
        const ruleCaption = data.analysis.rule_based_caption;

        const tagsContainer = document.getElementById("objectTags");
        tagsContainer.innerHTML = "";
        if (rawObjects.length === 0) {
          tagsContainer.innerHTML =
            "<span class='text-gray-400 italic'>Tidak ada objek terdeteksi</span>";
        } else {
          [...new Set(rawObjects)].forEach((obj) => {
            const span = document.createElement("span");
            span.className =
              "bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded border border-blue-200 uppercase";
            span.innerText = obj;
            tagsContainer.appendChild(span);
          });
        }

        const caption = llm.scene_caption || ruleCaption || "Tidak ada caption";
        document.getElementById("sceneCaption").innerText = `"${caption}"`;

        const riskBadge = document.getElementById("riskBadge");
        const riskLevel = llm.risk_level || ruleLevel;

        riskBadge.innerText = riskLevel;
        if (riskLevel === "HIGH") {
          riskBadge.className =
            "px-4 py-1 rounded-full text-sm font-bold text-white bg-red-600 animate-pulse";
        } else if (riskLevel === "LOW") {
          riskBadge.className =
            "px-4 py-1 rounded-full text-sm font-bold text-white bg-green-600";
        } else {
          riskBadge.className =
            "px-4 py-1 rounded-full text-sm font-bold text-white bg-yellow-500";
        }

        const riskList = document.getElementById("riskList");
        riskList.innerHTML = "";
        const aiRisks = llm.potential_safety_risks || [];

        const allRisks = [...new Set([...ruleBased, ...aiRisks])];

        if (allRisks.length === 0 && riskLevel === "LOW") {
          riskList.innerHTML =
            "<li class='text-green-600 italic'>Aman terkendali.</li>";
        } else if (allRisks.length === 0) {
          riskList.innerHTML =
            "<li class='text-gray-400'>Tidak ada detail risiko.</li>";
        } else {
          allRisks.forEach((r) => {
            const li = document.createElement("li");
            li.innerText = r;
            riskList.appendChild(li);
          });
        }

        const recList = document.getElementById("recommendationList");
        recList.innerHTML = "";
        const recommendations = llm.safety_recommendations || [
          "Tetap patuhi prosedur K3.",
        ];

        recommendations.forEach((r) => {
          const li = document.createElement("li");
          li.innerText = r;
          recList.appendChild(li);
        });

        document.getElementById("resultArea").classList.remove("hidden");
      }
    </script>
  </body>
</html>
